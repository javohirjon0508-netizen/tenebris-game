<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenebris UZ — Tergov Platformasi</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: #050608; color: #00ffaa; display: flex; flex-direction: column; height: 100vh; }
        
        header { background: #0e1217; padding: 15px; border-bottom: 2px solid #ff003c; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; color: #fff; font-weight: bold; text-shadow: 0 0 8px #ff003c; }
        .timer { font-size: 1.3rem; color: #ff003c; font-weight: bold; border: 1px solid #ff003c; padding: 4px 12px; }

        .main-container { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; padding: 10px; flex: 1; overflow: hidden; }
        
        .panel { background: #0a0d12; border: 1px solid #1f2937; padding: 15px; display: flex; flex-direction: column; border-radius: 4px; }
        .panel h2 { color: #d4af37; font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* Dalillar Paneli */
        .evidence-list { flex: 1; overflow-y: auto; }
        .evidence-item { background: #12161f; border-left: 3px solid #ff003c; padding: 10px; margin-bottom: 10px; font-size: 0.85rem; color: #ccc; }

        /* Terminal */
        .terminal-screen { flex: 1; background: #000; border: 1px solid #00ffaa; padding: 10px; overflow-y: auto; font-size: 0.85rem; margin-bottom: 10px; }
        .terminal-input { display: flex; }
        .terminal-input input { flex: 1; background: #111; border: 1px solid #00ffaa; color: #00ffaa; padding: 8px; outline: none; }

        /* Chat */
        .chat-box { flex: 1; background: #030406; border: 1px solid #222; padding: 10px; overflow-y: auto; font-size: 0.85rem; margin-bottom: 10px; }
        .chat-msg { margin-bottom: 8px; }
        .chat-msg .user { color: #d4af37; font-weight: bold; }
        .chat-msg.admin .user { color: #ff003c; }
        .chat-input { display: flex; gap: 5px; }
        .chat-input input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 8px; outline: none; }
        .chat-input button { background: #ff003c; color: #fff; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="logo">TENEBRIS // ARG TERMINAL</div>
    <div class="timer" id="timer">48:00:00</div>
</header>

<div class="main-container">
    <!-- 1. DALILLAR ARXIVI -->
    <div class="panel">
        <h2>📁 OCHILGAN DALILLAR</h2>
        <div class="evidence-list" id="evidence-list">
            <div class="evidence-item">
                <strong>DALIL #001:</strong> Jasur Rahimovning o'limi bo'yicha ilkinchi ekspertiza xulosasi platformaga yuklandi.
            </div>
        </div>
    </div>

    <!-- 2. INTERAKTIV TERMINAL -->
    <div class="panel">
        <h2>💻 FORENZIKA TERMINALI</h2>
        <div class="terminal-screen" id="terminal-screen">
            <div>[Tenebris OS v2.4 Init Success]</div>
            <div>Tizim buyruqlarini kiritish uchun 'help' yozing.</div>
        </div>
        <div class="terminal-input">
            <input type="text" id="cmd-input" placeholder="Buyruqni kiriting...">
        </div>
    </div>

    <!-- 3. LIVE GENERAL CHAT -->
    <div class="panel">
        <h2>💬 TERGOVCHILAR CHATI</h2>
        <div class="chat-box" id="chat-box"></div>
        <div class="chat-input">
            <input type="text" id="chat-msg-input" placeholder="Fikringizni yozing...">
            <button onclick="sendMessage()">YUBORISH</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const terminalScreen = document.getElementById('terminal-screen');
    const evidenceList = document.getElementById('evidence-list');

    // Chat Xabarini Yuborish
    function sendMessage() {
        const input = document.getElementById('chat-msg-input');
        if (input.value.trim() !== '') {
            socket.emit('send_message', { text: input.value });
            input.value = '';
        }
    }

    // Serverdan yangi xabarni qabul qilish
    socket.on('new_message', (data) => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-msg ${data.role}`;
        msgDiv.innerHTML = `<span class="user">[${data.time}] ${data.user}:</span> ${data.text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Terminal Buyrug'i Yuborish
    document.getElementById('cmd-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const cmd = e.target.value;
            socket.emit('run_command', cmd);
            e.target.value = '';
        }
    });

    socket.on('command_response', (data) => {
        terminalScreen.innerHTML += `<div><span style="color:#d4af37;">> ${data.cmd}</span></div>`;
        terminalScreen.innerHTML += `<div>${data.response}</div>`;
        terminalScreen.scrollTop = terminalScreen.scrollHeight;
    });

    // Yangi Dalil Chiqqanda
    socket.on('new_evidence', (evidence) => {
        const div = document.createElement('div');
        div.className = 'evidence-item';
        div.innerHTML = `<strong>${evidence.title}:</strong> ${evidence.desc}`;
        evidenceList.prepend(div);
        alert("🚨 YANGI DALIL TAQDIM ETILDI!");
    });
</script>

</body>
</html>
