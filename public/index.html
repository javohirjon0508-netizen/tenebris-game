<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TENEBRIS // TERMINAL</title>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #05070a;
            color: #00ff66;
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        /* CRT MONITOR EFFEKTI */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .terminal-box {
            max-width: 520px;
            width: 100%;
            background: rgba(10, 14, 20, 0.95);
            border: 2px solid #00ff66;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: #00ff66;
            text-shadow: 0 0 8px #00ff66;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .cyber-btn {
            background: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 12px 20px;
            font-family: 'Fira Code', monospace;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            box-shadow: inset 0 0 5px rgba(0, 255, 102, 0.2);
        }

        .cyber-btn:hover {
            background: #00ff66;
            color: #05070a;
            box-shadow: 0 0 15px #00ff66;
        }

        /* CASE FILE STYLE */
        .case-folder {
            background: #0d131d;
            border: 1px dashed #00ff66;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .case-folder::before {
            content: "TOP SECRET";
            position: absolute;
            top: -10px; right: 10px;
            background: #ff0055;
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .case-title { color: #00f0ff; font-weight: bold; margin-bottom: 8px; }
        .case-desc { color: #a0aec0; font-size: 0.85rem; margin-bottom: 12px; line-height: 1.4; }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #05070a;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-family: 'Fira Code', monospace;
            margin-bottom: 10px;
            outline: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #00ff66;
        }
    </style>
</head>
<body>

<div class="terminal-box">
    <!-- AUTH EKRANI -->
    <div id="auth-screen" style="text-align: center;">
        <h1>🕵️‍♂️ TENEBRIS // TERMINAL</h1>
        <p style="color: #8a99ad; font-size: 0.85rem; margin-bottom: 25px;">[ SYSTEM ACCESS REQUIRED ]<br>Davom etish uchun identifikatsiyadan o'ting.</p>
        <button class="cyber-btn" onclick="loginWithGoogle()">> GOOGLE IDENTITY LINK</button>
    </div>

    <!-- O'YIN EKRANI -->
    <div id="game-screen" style="display: none;">
        <div class="header-bar">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="u-avatar" class="avatar" src="">
                <div>
                    <div id="u-name" style="font-size: 0.9rem; font-weight: bold;">AGEMT</div>
                    <a id="admin-link" href="/admin.html" style="color: #ff0055; font-size: 0.75rem; display: none; text-decoration: none;">[ ADMIN ACCESS ]</a>
                </div>
            </div>
            <div id="u-level" style="border: 1px solid #00f0ff; color: #00f0ff; padding: 3px 8px; font-size: 0.8rem;">CLEARANCE: LVL 1</div>
        </div>

        <h3 style="font-size: 0.9rem; color: #8a99ad; margin-bottom: 15px;">// ACTIVE CASE FILES:</h3>
        <div id="cases-list"></div>
    </div>
</div>

<script>
    // OVOZ EFFECTLARI (SFX)
    const clickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
    const successSound = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');

    function playSound(type) {
        if(type === 'click') clickSound.play().catch(() => {});
        if(type === 'success') successSound.play().catch(() => {});
    }

    const firebaseConfig = {
        apiKey: "AIzaSyALWGXz15GQslY6fJI8noiLbXKH-yCB1gI",
        authDomain: "web-ilova.firebaseapp.com",
        projectId: "web-ilova",
        storageBucket: "web-ilova.firebasestorage.app",
        messagingSenderId: "222468122005",
        appId: "1:222468122005:web:7443bbd80aaf95634d829c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const socket = typeof io !== 'undefined' ? io() : null;

    function loginWithGoogle() {
        playSound('click');
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("ACCESS DENIED: " + err.message));
    }

    auth.onAuthStateChanged((user) => {
        if (user && socket) {
            socket.emit('player-login', {
                uid: user.uid,
                displayName: user.displayName,
                email: user.email,
                photoURL: user.photoURL,
                level: parseInt(localStorage.getItem('p_level') || 1)
            });
        }
    });

    if (socket) {
        socket.on('auth-success', ({ user, cases }) => {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            document.getElementById('u-avatar').src = user.photo || 'https://via.placeholder.com/40';
            document.getElementById('u-name').innerText = user.name.toUpperCase();
            document.getElementById('u-level').innerText = `CLEARANCE: LVL ${user.level}`;

            if (user.isAdmin) {
                document.getElementById('admin-link').style.display = 'inline';
            }

            renderCases(cases);
        });

        socket.on('answer-result', (res) => {
            if (res.success) {
                playSound('success');
                alert("[ ACCESS GRANTED ] To'g me'mor xulosa!");
                localStorage.setItem('p_level', res.newLevel);
                document.getElementById('u-level').innerText = `CLEARANCE: LVL ${res.newLevel}`;
                renderCases(res.cases);
            } else {
                alert("[ ACCESS DENIED ] Noto'g'ri kod!");
            }
        });
    }

    function renderCases(cases) {
        const container = document.getElementById('cases-list');
        container.innerHTML = '';

        if (!cases || cases.length === 0) {
            container.innerHTML = '<p style="color: #8a99ad; font-size: 0.8rem;">// NO ACTIVE CASES ASSIGNED.</p>';
            return;
        }

        cases.forEach(c => {
            const folder = document.createElement('div');
            folder.className = 'case-folder';
            folder.innerHTML = `
                <div class="case-title">[CASE #${c.id.toString().slice(-4)}] ${c.title}</div>
                <div style="font-size: 0.7rem; color: #ff0055; margin-bottom: 8px;">TYPE: ${c.category || 'CLASSIFIED'}</div>
                <div class="case-desc">${c.desc}</div>
                <input type="text" id="ans-${c.id}" placeholder="EXECUTE DECRYPTION CODE...">
                <button class="cyber-btn" onclick="submitAnswer(${c.id})">VERIFY CODE</button>
            `;
            container.appendChild(folder);
        });
    }

    function submitAnswer(caseId) {
        playSound('click');
        const input = document.getElementById(`ans-${caseId}`).value;
        if (input && socket) {
            socket.emit('submit-answer', { caseId, answer: input });
        }
    }
</script>
</body>
</html>
