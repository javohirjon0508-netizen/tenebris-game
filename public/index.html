<!DOCTYPE html>
<html lang="uz and english">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiber-Detektiv OS</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        :root {
            --bg: #090a0f;
            --card: #12151e;
            --border: #1f293d;
            --accent: #00f0ff;
            --success: #00ff66;
            --danger: #ff0055;
            --text: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            padding: 16px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--accent);
        }

        .level-badge {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .content { padding: 16px; flex: 1; }

        .auth-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
            gap: 20px;
        }

        .btn-google {
            background: #fff;
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }

        .case-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .case-title { color: var(--accent); font-size: 1.1rem; margin-bottom: 8px; }
        .case-desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 12px; line-height: 1.4; }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            background: #090a0f;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            margin-bottom: 10px;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        #admin-panel {
            display: none;
            border-top: 2px dashed var(--accent);
            margin-top: 20px;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- GOOGLE AUTH OYNASI -->
    <div id="auth-screen" class="auth-box">
        <h1 style="color: var(--accent);">🕵️ KIBER-DETEKTIV</h1>
        <p style="color: #94a3b8;">Jinoyatlarni ochish va darajalarni oshirish uchun Google hisobingiz bilan kiring.</p>
        <button class="btn-google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Google orqali kirish
        </button>
    </div>

    <!-- ASOSIY O'YIN INTERFEYSI -->
    <div id="game-screen" style="display: none;">
        <div class="header">
            <div class="user-profile">
                <img id="u-avatar" class="user-avatar" src="" alt="User">
                <div>
                    <h4 id="u-name" style="font-size: 0.9rem;">Detektiv</h4>
                    <span id="admin-tag" style="color: var(--danger); font-size: 0.75rem; display:none;">ADMIN</span>
                </div>
            </div>
            <span class="level-badge" id="u-level">LEVEL 1</span>
        </div>

        <div class="content">
            <h3 style="margin-bottom: 12px; font-size: 1rem; color: #94a3b8;">OCHIQ JINOYAT ISHLARI</h3>
            <div id="cases-list"></div>

            <!-- FAQT ADMIN UCHUN KO'RINADIGAN BO'LIM -->
            <div id="admin-panel">
                <h3 style="color: var(--danger); margin-bottom: 10px;">⚙️ ADMIN: YANGI JINOYAT QO'SHISH</h3>
                <input type="number" id="adm-level" placeholder="Daraja (Level raqami)" value="1">
                <input type="text" id="adm-title" placeholder="Jinoyat sarlavhasi">
                <textarea id="adm-desc" placeholder="Jinoyat tavsifi va topishmoq..."></textarea>
                <input type="text" id="adm-answer" placeholder="To'g'ri javob / Parol">
                <button class="btn-action" style="background: var(--danger); color: #fff;" onclick="addCase()">JINOYATNI CHOP ETISH</button>
            </div>
        </div>
    </div>

</div>

<script>
    // // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyALWGXz15GQslY6fJI8noiLbXKH-yCB1gI",
  authDomain: "web-ilova.firebaseapp.com",
  projectId: "web-ilova",
  storageBucket: "web-ilova.firebasestorage.app",
  messagingSenderId: "222468122005",
  appId: "1:222468122005:web:7443bbd80aaf95634d829c",
  measurementId: "G-TFCS0P7416"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const socket = io();

    let currentUser = null;

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = {
                uid: user.uid,
                displayName: user.displayName,
                email: user.email,
                photoURL: user.photoURL,
                level: parseInt(localStorage.getItem('p_level') || 1)
            };
            socket.emit('player-login', currentUser);
        }
    });

    socket.on('auth-success', ({ user, cases }) => {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        document.getElementById('u-avatar').src = user.photo;
        document.getElementById('u-name').innerText = user.name;
        document.getElementById('u-level').innerText = `LEVEL ${user.level}`;

        if (user.isAdmin) {
            document.getElementById('admin-tag').style.display = 'block';
            document.getElementById('admin-panel').style.display = 'block';
        }

        renderCases(cases);
    });

    function renderCases(cases) {
        const container = document.getElementById('cases-list');
        container.innerHTML = '';

        cases.forEach(c => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.innerHTML = `
                <div class="case-title">[L- ${c.level}] ${c.title}</div>
                <div class="case-desc">${c.desc}</div>
                <input type="text" id="ans-${c.id}" placeholder="Kodni kiritish...">
                <button class="btn-action" onclick="submitAnswer(${c.id})">TEKSHIRISH</button>
            `;
            container.appendChild(card);
        });
    }

    function submitAnswer(caseId) {
        const input = document.getElementById(`ans-${caseId}`).value;
        if (input) {
            socket.emit('submit-answer', { caseId, answer: input });
        }
    }

    socket.on('answer-result', (res) => {
        if (res.success) {
            alert("To'g'ri! Keyingi daraja ochildi.");
            localStorage.setItem('p_level', res.newLevel);
            document.getElementById('u-level').innerText = `LEVEL ${res.newLevel}`;
            renderCases(res.cases);
        } else {
            alert(res.message);
        }
    });

    function addCase() {
        const level = document.getElementById('adm-level').value;
        const title = document.getElementById('adm-title').value;
        const desc = document.getElementById('adm-desc').value;
        const answer = document.getElementById('adm-answer').value;

        if (title && desc && answer) {
            socket.emit('add-case', { level, title, desc, answer });
            alert("Jinoyat ishi qo'shildi!");
        }
    }
</script>
</body>
</html>
