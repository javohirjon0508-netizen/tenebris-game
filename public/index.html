<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenebris-Detektiv</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            text-align: center;
            max-width: 400px;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        p {
            color: #a0aec0;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .google-btn {
            background-color: #f4c430
            color: #1a202c;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .google-btn:hover {
            background-color: #edf2f7;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>🕵️‍♂️ TENEBRIS-DETEKTIV</h1>
        <p>Jinoyatlarni ochish va darajalarni oshirish uchun Google hisobingiz bilan kiring.</p>
        <button class="google-btn" id="google-login-btn">G Google orqali kirish</button>
    </div>
<script>
    // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyALWGXz15GQslY6fJI8noiLbXKH-yCB1gI",
  authDomain: "web-ilova.firebaseapp.com",
  projectId: "web-ilova",
  storageBucket: "web-ilova.firebasestorage.app",
  messagingSenderId: "222468122005",
  appId: "1:222468122005:web:7443bbd80aaf95634d829c",
  measurementId: "G-TFCS0P7416"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const socket = io();

    let currentUser = null;

    function loginWithGoogle() {
        if (typeof firebase === 'undefined' || !firebase.auth) {
            alert("Xatolik: Firebase kutubxonasi yuklanmagan!");
            return;
        }

        const provider = new firebase.auth.GoogleAuthProvider();
        
        auth.signInWithPopup(provider)
            .then((result) => {
                alert("Muvaffaqiyatli kirildi: " + result.user.displayName);
            })
            .catch((error) => {
                alert("GOOGLE AUTH XATOSI:\n\nKod: " + error.code + "\nXabar: " + error.message);
            });
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = {
                uid: user.uid,
                displayName: user.displayName,
                email: user.email,
                photoURL: user.photoURL,
                level: parseInt(localStorage.getItem('p_level') || 1)
            };
            socket.emit('player-login', currentUser);
        }
    });

    socket.on('auth-success', ({ user, cases }) => {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        document.getElementById('u-avatar').src = user.photo;
        document.getElementById('u-name').innerText = user.name;
        document.getElementById('u-level').innerText = `LEVEL ${user.level}`;

        if (user.isAdmin) {
            document.getElementById('admin-tag').style.display = 'block';
            document.getElementById('admin-panel').style.display = 'block';
        }

        renderCases(cases);
    });

    function renderCases(cases) {
        const container = document.getElementById('cases-list');
        container.innerHTML = '';

        cases.forEach(c => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.innerHTML = `
                <div class="case-title">[L- ${c.level}] ${c.title}</div>
                <div class="case-desc">${c.desc}</div>
                <input type="text" id="ans-${c.id}" placeholder="Kodni kiritish...">
                <button class="btn-action" onclick="submitAnswer(${c.id})">TEKSHIRISH</button>
            `;
            container.appendChild(card);
        });
    }

    function submitAnswer(caseId) {
        const input = document.getElementById(`ans-${caseId}`).value;
        if (input) {
            socket.emit('submit-answer', { caseId, answer: input });
        }
    }

    socket.on('answer-result', (res) => {
        if (res.success) {
            alert("To'g'ri! Keyingi daraja ochildi.");
            localStorage.setItem('p_level', res.newLevel);
            document.getElementById('u-level').innerText = `LEVEL ${res.newLevel}`;
            renderCases(res.cases);
        } else {
            alert(res.message);
        }
    });

    function addCase() {
        const level = document.getElementById('adm-level').value;
        const title = document.getElementById('adm-title').value;
        const desc = document.getElementById('adm-desc').value;
        const answer = document.getElementById('adm-answer').value;

        if (title && desc && answer) {
            socket.emit('add-case', { level, title, desc, answer });
            alert("Jinoyat ishi qo'shildi!");
        }
    }
</script>
</body>
</html>
