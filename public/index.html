<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tenebris-Detektiv</title>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body { margin: 0; padding: 20px; background-color: #0d0f12; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 480px; width: 100%; }
        h1 { font-size: 2rem; color: #00f0ff; text-align: center; margin-bottom: 10px; }
        .google-btn { background-color: #f4c430; color: #1a202c; border: none; padding: 15px; font-size: 1.1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; }
        .case-card { background: #12151e; border: 1px solid #1f293d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .case-title { color: #00f0ff; font-size: 1.1rem; font-weight: bold; margin-bottom: 6px; }
        .case-desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 12px; }
        input[type="text"] { width: 100%; padding: 10px; background: #090a0f; border: 1px solid #1f293d; border-radius: 8px; color: #fff; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        .btn-action { width: 100%; padding: 12px; background: #00f0ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-screen" class="container" style="text-align: center;">
        <h1>🕵️‍♂️ TENEBRIS-DETEKTIV</h1>
        <p style="color: #a0aec0; margin-bottom: 30px;">Tizimga kirish uchun Google hisobingizdan foydalaning.</p>
        <button class="google-btn" onclick="loginWithGoogle()">G Google orqali kirish</button>
    </div>

    <div id="game-screen" class="container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1f293d; padding-bottom: 10px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="u-avatar" src="" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #00f0ff;">
                <div>
                    <div id="u-name" style="font-weight: bold;">Detektiv</div>
                    <a id="admin-link" href="/admin.html" style="color: #ff0055; font-size: 0.8rem; display: none; text-decoration: none; font-weight: bold;">[ ADMIN PANELGA O'TISH ]</a>
                </div>
            </div>
            <div id="u-level" style="background: rgba(0, 240, 255, 0.1); color: #00f0ff; border: 1px solid #00f0ff; padding: 4px 12px; border-radius: 12px; font-size: 0.9rem; font-weight: bold;">LEVEL 1</div>
        </div>

        <h3 style="color: #a0aec0; margin-bottom: 15px;">OCHIQ JINOYAT ISHLARI</h3>
        <div id="cases-list"></div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyALWGXz15GQslY6fJI8noiLbXKH-yCB1gI",
        authDomain: "web-ilova.firebaseapp.com",
        projectId: "web-ilova",
        storageBucket: "web-ilova.firebasestorage.app",
        messagingSenderId: "222468122005",
        appId: "1:222468122005:web:7443bbd80aaf95634d829c",
        measurementId: "G-TFCS0P7416"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const socket = typeof io !== 'undefined' ? io() : null;

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("Xato: " + err.message));
    }

    auth.onAuthStateChanged((user) => {
        if (user && socket) {
            socket.emit('player-login', {
                uid: user.uid,
                displayName: user.displayName,
                email: user.email,
                photoURL: user.photoURL,
                level: parseInt(localStorage.getItem('p_level') || 1)
            });
        }
    });

    if (socket) {
        socket.on('auth-success', ({ user, cases }) => {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            document.getElementById('u-avatar').src = user.photo || 'https://via.placeholder.com/40';
            document.getElementById('u-name').innerText = user.name;
            document.getElementById('u-level').innerText = `LEVEL ${user.level}`;

            if (user.isAdmin) {
                document.getElementById('admin-link').style.display = 'inline';
            }

            renderCases(cases);
        });

        socket.on('answer-result', (res) => {
            if (res.success) {
                alert("To'g'ri xulosa! Keyingi daraja ochildi.");
                localStorage.setItem('p_level', res.newLevel);
                document.getElementById('u-level').innerText = `LEVEL ${res.newLevel}`;
                renderCases(res.cases);
            } else {
                alert(res.message);
            }
        });
    }

    function renderCases(cases) {
        const container = document.getElementById('cases-list');
        container.innerHTML = '';

        if (!cases || cases.length === 0) {
            container.innerHTML = '<p style="color: #64748b;">Hozircha ochiq jinoyat ishlari yo\'q.</p>';
            return;
        }

        cases.forEach(c => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.innerHTML = `
                <div class="case-title">[L-${c.level}] ${c.title}</div>
                <div style="font-size: 0.75rem; color: #ff0055; margin-bottom: 5px; font-weight: bold;">${c.category || 'Tergov'}</div>
                <div class="case-desc">${c.desc}</div>
                <input type="text" id="ans-${c.id}" placeholder="Javob yoki gumondor ID si...">
                <button class="btn-action" onclick="submitAnswer(${c.id})">XULOSANI TOPSHIRISH</button>
            `;
            container.appendChild(card);
        });
    }

    function submitAnswer(caseId) {
        const input = document.getElementById(`ans-${caseId}`).value;
        if (input && socket) {
            socket.emit('submit-answer', { caseId, answer: input });
        }
    }
</script>
</body>
</html>
