<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiber-Pult | Admin Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #238636;
            --danger-color: #da3633;
            --text-color: #c9d1d9;
            --glow-color: rgba(56, 139, 253, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Modal Auth UI */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        .auth-card h2 {
            margin-bottom: 15px;
            color: #58a6ff;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* Main Panel Layout */
        #admin-panel {
            display: none;
            width: 100%;
            max-width: 900px;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .panel-header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h1 {
            font-size: 1.4rem;
            color: #58a6ff;
        }

        .status-badge {
            background: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid #238636;
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-card h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Inputs & Buttons */
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px var(--glow-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Players List */
        .players-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
        }

        .player-item {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: bold;
            color: #e6edf3;
        }

        .btn-private {
            background: #1f6beb;
            padding: 6px 10px;
            font-size: 0.8rem;
            width: auto;
        }

        /* Private Message Modal */
        #pm-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .file-upload-wrapper {
            margin-bottom: 12px;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-label {
            display: block;
            background: #21262d;
            border: 1px dashed var(--border-color);
            padding: 12px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            color: #8b949e;
        }

        .file-upload-label:hover {
            border-color: #58a6ff;
            color: #fff;
        }

        #file-preview {
            max-width: 100%;
            max-height: 150px;
            margin-top: 10px;
            display: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Kirish Paroli Oynasi -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>🔒 KIBER-PULT ACCESS</h2>
            <input type="password" id="admin-pass" placeholder="Parolni kiriting...">
            <button onclick="checkAuth()">KIRISH</button>
            <p id="auth-err" style="color: var(--danger-color); font-size: 0.85rem; margin-top: 10px; display: none;">Xato parol kiritildi!</p>
        </div>
    </div>

    <!-- Asosiy Boshqaruv Paneli -->
    <div id="admin-panel">
        <div class="panel-header">
            <h1>⚙️ BOSHGARUV PANELI</h1>
            <span class="status-badge" id="server-status">ONLINE</span>
        </div>

        <!-- Onlayn O'yinchilar Bo'limi -->
        <div class="section-card">
            <h3>🟢 ONLAYN O'YINCHILAR (<span id="player-count">0</span>)</h3>
            <div class="players-list" id="players-container">
                <p style="color: #8b949e;">Hozircha hech kim onlayn emas...</p>
            </div>
        </div>

        <!-- Dalillar va Rasm Yuklash Bo'limi -->
        <div class="section-card">
            <h3>🖼️ YANGI DALIL / RASM YUKLASH</h3>
            <input type="text" id="evidence-title" placeholder="Dalil sarlavhasi (masalan: Iz 04)">
            <textarea id="evidence-desc" rows="3" placeholder="Dalil tavsifi hamda xabar matni..."></textarea>
            
            <div class="file-upload-wrapper">
                <label for="evidence-file" class="file-upload-label" id="file-label">📁 Galereyadan rasm tanlang</label>
                <input type="file" id="evidence-file" accept="image/*" onchange="handleFileSelect(event)">
                <img id="file-preview" src="#" alt="Preview">
            </div>

            <button onclick="sendEvidence()">DALILNI RASMI BILAN YUBORISH</button>
        </div>
    </div>

    <!-- Shaxsiy Xabar Yuborish Modali -->
    <div id="pm-modal">
        <div class="auth-card" style="max-width: 400px;">
            <h3>💬 Shaxsiy Xabar: <span id="pm-target-name" style="color: #58a6ff;"></span></h3>
            <textarea id="pm-message" rows="4" placeholder="Xabaringizni yozing..."></textarea>
            <div style="display: flex; gap: 10px;">
                <button onclick="sendPrivateMessage()">YUBORISH</button>
                <button onclick="closePmModal()" style="background: #21262d;">BEKOR QILISH</button>
            </div>
        </div>
    </div>

    <script>
        // SOZLANGAN PAROL: zaynab
        const ADMIN_PASSWORD = "zaynab";
        const socket = io();
        let selectedPlayerId = null;
        let selectedImageData = null;

        function checkAuth() {
            const input = document.getElementById("admin-pass").value;
            if (input === ADMIN_PASSWORD) {
                document.getElementById("auth-overlay").style.display = "none";
                document.getElementById("admin-panel").style.display = "grid";
                socket.emit("admin-login");
            } else {
                document.getElementById("auth-err").style.display = "block";
            }
        }

        // Enter tugmasini bosganda ham kirish
        document.getElementById("admin-pass").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAuth();
        });

        // O'yinchilar ro'yxatini qabul qilish
        socket.on("update-players", (players) => {
            const container = document.getElementById("players-container");
            document.getElementById("player-count").innerText = players.length;

            if (players.length === 0) {
                container.innerHTML = `<p style="color: #8b949e;">Hozircha hech kim onlayn emas...</p>`;
                return;
            }

            container.innerHTML = "";
            players.forEach(player => {
                const item = document.createElement("div");
                item.className = "player-item";
                item.innerHTML = `
                    <span class="player-name">👤 ${player.name}</span>
                    <button class="btn-private" onclick="openPmModal('${player.id}', '${player.name}')">💬 Shaxsiy Xabar</button>
                `;
                container.appendChild(item);
            });
        });

        // Shaxsiy xabar oynasini ochish
        function openPmModal(id, name) {
            selectedPlayerId = id;
            document.getElementById("pm-target-name").innerText = name;
            document.getElementById("pm-modal").style.display = "flex";
        }

        function closePmModal() {
            document.getElementById("pm-modal").style.display = "none";
            document.getElementById("pm-message").value = "";
            selectedPlayerId = null;
        }

        function sendPrivateMessage() {
            const msg = document.getElementById("pm-message").value;
            if (msg && selectedPlayerId) {
                socket.emit("send-private-msg", { targetId: selectedPlayerId, message: msg });
                alert("Shaxsiy xabar yuborildi!");
                closePmModal();
            }
        }

        // Galereyadan rasmni o'qib olish (Base64)
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageData = e.target.result;
                    const preview = document.getElementById("file-preview");
                    preview.src = selectedImageData;
                    preview.style.display = "block";
                    document.getElementById("file-label").innerText = `📁 ${file.name}`;
                };
                reader.readAsDataURL(file);
            }
        }

        // Dalil va Rasmni tarqatish
        function sendEvidence() {
            const title = document.getElementById("evidence-title").value;
            const desc = document.getElementById("evidence-desc").value;

            if (!title || !desc) {
                alert("Sarlavha va tavsifni kiriting!");
                return;
            }

            socket.emit("new-evidence", {
                title: title,
                desc: desc,
                image: selectedImageData
            });

            alert("Dalil barcha o'yinchilarga muvaffaqiyatli yuborildi!");
            
            // Maydonlarni tozalash
            document.getElementById("evidence-title").value = "";
            document.getElementById("evidence-desc").value = "";
            document.getElementById("evidence-file").value = "";
            document.getElementById("file-preview").style.display = "none";
            document.getElementById("file-label").innerText = "📁 Galereyadan rasm tanlang";
            selectedImageData = null;
        }
    </script>
</body>
</html>
