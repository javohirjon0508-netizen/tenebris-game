<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenebris-Detektiv | Admin Panel</title>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0b0e14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
        }
        .admin-box {
            max-width: 550px;
            width: 100%;
            background: #121721;
            border: 1px solid #1e2638;
            padding: 25px;
            border-radius: 12px;
        }
        h2 { color: #ff0055; margin-bottom: 20px; border-bottom: 1px solid #1e2638; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #00f0ff; margin-bottom: 5px; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #0b0e14;
            border: 1px solid #1e2638;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #ff0055;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #d60047; }
        #auth-gate { text-align: center; padding: 40px 0; }
        .google-btn { background: #f4c430; color: #000; border: none; padding: 12px 25px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-box">
    <!-- AUTH TEKSHIRUV EKRANI -->
    <div id="auth-gate">
        <h3 style="color: #00f0ff;">⚙️ ADMIN PANELGA KIRISH</h3>
        <p style="color: #8a99ad; font-size: 0.9rem;">Boshqaruv paneliga kirish uchun Admin Google hisobingizdan foydalaning.</p>
        <button class="google-btn" onclick="loginAdmin()">G Google orqali tasdiqlash</button>
    </div>

    <!-- MAIN ADMIN FORM -->
    <div id="admin-content" style="display: none;">
        <h2>⚙️ YANGI TERGOV ISHI YARATISH</h2>

        <div class="form-group">
            <label>O'yinchi Darajasi (Level)</label>
            <input type="number" id="adm-level" value="1">
        </div>

        <div class="form-group">
            <label>Jinoyat Ishi Sarlavhasi</label>
            <input type="text" id="adm-title" placeholder="Masalan: 001-SONLI ISH: Tun qorong'usi">
        </div>

        <div class="form-group">
            <label>Kategoriya</label>
            <input type="text" id="adm-category" placeholder="Qotillik / O'g'rilik / Kiber-jinoyat">
        </div>

        <div class="form-group">
            <label>Hodisa Joyi Tafsilotlari (Overview)</label>
            <textarea id="adm-desc" rows="4" placeholder="Voqea sodir bo'lgan joy, vaqt va birinchi belgilar..."></textarea>
        </div>

        <div class="form-group">
            <label>Asosiy Gumondor Ismi / ID si</label>
            <input type="text" id="adm-suspect" placeholder="Masalan: Jasur Komilov (susp_1)">
        </div>

        <div class="form-group">
            <label>To'g'ri Kalit So'z / Parol / Masalani Yechimi</label>
            <input type="text" id="adm-answer" placeholder="Masalan: susp_1 yoki pichoq">
        </div>

        <button class="btn-submit" onclick="publishCase()">CHOP ETISH (PUBLISH)</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyALWGXz15GQslY6fJI8noiLbXKH-yCB1gI",
        authDomain: "web-ilova.firebaseapp.com",
        projectId: "web-ilova",
        storageBucket: "web-ilova.firebasestorage.app",
        messagingSenderId: "222468122005",
        appId: "1:222468122005:web:7443bbd80aaf95634d829c",
        measurementId: "G-TFCS0P7416"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const socket = typeof io !== 'undefined' ? io() : null;

    function loginAdmin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("Xato: " + err.message));
    }

    auth.onAuthStateChanged((user) => {
        if (user && socket) {
            socket.emit('player-login', {
                uid: user.uid,
                displayName: user.displayName,
                email: user.email,
                photoURL: user.photoURL
            });
        }
    });

    if (socket) {
        socket.on('auth-success', ({ user }) => {
            if (user.isAdmin) {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            } else {
                alert("RUXSAT BERILMAGAN! Siz Admin emassiz.");
                window.location.href = "/";
            }
        });
    }

    function publishCase() {
        const level = document.getElementById('adm-level').value;
        const title = document.getElementById('adm-title').value;
        const category = document.getElementById('adm-category').value;
        const desc = document.getElementById('adm-desc').value;
        const suspect = document.getElementById('adm-suspect').value;
        const answer = document.getElementById('adm-answer').value;

        if (title && desc && answer && socket) {
            socket.emit('add-case', { level, title, category, desc, suspect, answer });
            alert("Yangi jinoyat ishi muvaffaqiyatli chop etildi!");
            document.getElementById('adm-title').value = '';
            document.getElementById('adm-category').value = '';
            document.getElementById('adm-desc').value = '';
            document.getElementById('adm-suspect').value = '';
            document.getElementById('adm-answer').value = '';
        } else {
            alert("Iltimos, barcha maydonlarni to'ldiring!");
        }
    }
</script>
</body>
</html>
