<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenebris Master Console V3</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: #05080c; color: #00ffaa; padding: 15px; }
        
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #020305; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .auth-box { background: #0d131d; border: 2px solid #ff003c; padding: 25px; border-radius: 8px; text-align: center; max-width: 360px; width: 90%; }
        .auth-box input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #00ffaa; text-align: center; margin: 12px 0; }
        .auth-box button { width: 100%; padding: 12px; background: #ff003c; color: #fff; border: none; font-weight: bold; cursor: pointer; }

        #admin-content { display: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #0a0f18; border: 1px solid #1f2937; padding: 15px; border-radius: 6px; }
        .card-header { font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; display: flex; justify-content: space-between; }
        
        input, textarea, button { width: 100%; padding: 10px; margin-top: 8px; background: #030508; border: 1px solid #1f2937; color: #fff; border-radius: 4px; outline: none; }
        button { cursor: pointer; font-weight: bold; }
        .btn-red { background: #ff003c; color: #fff; border: none; }
        .btn-gold { background: #d4af37; color: #000; border: none; }
        .btn-blue { background: #0088cc; color: #fff; border: none; }

        .player-item { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #222; }
        .player-item button { width: auto; margin: 0; padding: 4px 8px; font-size: 0.75rem; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box">
        <h2 style="color:#ff003c;">🔒 KIBER-PULT ACCESS</h2>
        <input type="password" id="admin-pass-input" placeholder="••••••••" onkeypress="if(event.key==='Enter') checkPassword()">
        <button onclick="checkPassword()">TIZIMGA KIRISH</button>
    </div>
</div>

<h2 style="color:#ff003c; text-align:center;">🎛 MASTER CONSOLE V3 (PLAYERS & MEDIA)</h2>

<div id="admin-content">

    <!-- 1. ONLAYN O'YINCHILAR RO'YXATI & SHAXSIY XABAR -->
    <div class="card" style="border-left: 4px solid #00ffaa;">
        <div class="card-header" style="color:#00ffaa;">🟢 ONLAYN O'YINCHILAR</div>
        <div id="players-list" style="max-height: 200px; overflow-y: auto;">
            <div style="color:#888; font-size:0.8rem;">[O'yinchilar kutilmoqda...]</div>
        </div>
    </div>

    <!-- 2. GALEREYADAN RASM YUKLASH HAMDA DALIL CHIQARISH -->
    <div class="card" style="border-left: 4px solid #d4af37;">
        <div class="card-header" style="color:#d4af37;">📷 RASMLI DALIL YUBORISH</div>
        <input type="text" id="ev-title" placeholder="Dalil Nomi (masalan: FOTO DALIL #001)">
        <textarea id="ev-desc" placeholder="Tavsif..."></textarea>
        
        <label style="font-size:0.8rem; color:#aaa; margin-top:10px; display:block;">Qurilmadan rasm faylini tanlang:</label>
        <input type="file" id="ev-file-input" accept="image/*" style="background:#111;">

        <button class="btn-gold" onclick="sendEvidenceWithImage()">DALILNI RASMI BILAN YUBORISH</button>
    </div>

    <!-- 3. CHAT VA RESET -->
    <div class="card" style="border-left: 4px solid #ff003c;">
        <div class="card-header" style="color:#ff003c;">💬 UMUMIY CHAT & RESET</div>
        <input type="text" id="admin-nick" placeholder="Nomingiz (masalan: ADMIN)">
        <input type="text" id="admin-msg" placeholder="Umumiy xabar...">
        <button class="btn-red" onclick="sendMsg()">UMUMIY CHATGA YUBORISH</button>
        <hr style="border-color:#1f2937; margin:15px 0;">
        <input type="text" id="new-case-title" placeholder="Yangi Ish Sarlavhasi">
        <button class="btn-gold" onclick="startNewCase()">⚠️ YANGI JINOIY ISH BOSHLASH</button>
    </div>

</div>

<script>
    const ADMIN_PASSWORD = "Tenebris2026!";

    function checkPassword() {
        if (document.getElementById('admin-pass-input').value === ADMIN_PASSWORD) {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'grid';
        }
    }

    const socket = io();

    // Onlayn O'yinchilar Ro'yxatini Qabul Qilish
    socket.on('update_online_players', (playersMap) => {
        const container = document.getElementById('players-list');
        container.innerHTML = '';

        const keys = Object.keys(playersMap);
        if(keys.length === 0) {
            container.innerHTML = '<div style="color:#888; font-size:0.8rem;">[Ayni vaqda o\'yinchilar yo\'q]</div>';
            return;
        }

        keys.forEach(socketId => {
            const nick = playersMap[socketId];
            const item = document.createElement('div');
            item.className = 'player-item';
            item.innerHTML = `
                <span>👤 <strong>${nick}</strong></span>
                <button class="btn-blue" onclick="sendPrivateMsg('${socketId}', '${nick}')">💬 Shaxsiy Xabar</button>
            `;
            container.appendChild(item);
        });
    });

    // Shaxsiy Xabar Yuborish
    function sendPrivateMsg(socketId, nick) {
        const text = prompt(`[${nick}] uchun maxfiy shaxsiy xabaringizni yozing:`);
        if(text) {
            socket.emit('admin_send_private_msg', {
                targetSocketId: socketId,
                text: text,
                from: 'ADMIN MAXFIY BIRIKTIRMA'
            });
            alert(`Xabar ${nick} ga yuborildi!`);
        }
    }

    // Qurilmadagi Rasm Faylini O'qib Dalil Sifatida Yuborish
    function sendEvidenceWithImage() {
        const title = document.getElementById('ev-title').value;
        const desc = document.getElementById('ev-desc').value;
        const fileInput = document.getElementById('ev-file-input');

        if(!title || !desc) {
            alert("Sarlavha va tavsifni yozing!");
            return;
        }

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result; // Rasm kodi
                socket.emit('admin_release_evidence', { title, desc, image: base64Image });
                alert("Rasmli dalil yuborildi!");
                document.getElementById('ev-title').value = '';
                document.getElementById('ev-desc').value = '';
                fileInput.value = '';
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            // Rasmsiz dalil
            socket.emit('admin_release_evidence', { title, desc, image: null });
            alert("Dalil yuborildi!");
        }
    }

    function sendMsg() {
        const user = document.getElementById('admin-nick').value || 'ADMIN';
        const text = document.getElementById('admin-msg').value;
        if(text) {
            socket.emit('send_message', { user, text, role: 'admin' });
            document.getElementById('admin-msg').value = '';
        }
    }

    function startNewCase() {
        const title = document.getElementById('new-case-title').value;
        if(title && confirm("Yangi jinoyat boshlansinmi?")) {
            socket.emit('admin_start_new_case', { title });
        }
    }
</script>

</body>
</html>
